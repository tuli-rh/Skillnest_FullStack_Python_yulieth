<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Canciones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-5">

                <h1>Nueva Canción</h1>

                <form action="{{ url_for('crear_cancion') }}" method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Título
                        </label>

                        <input type="text" name="titulo" class="form-control" required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Artista
                        </label>

                        <input type="text" name="artista" class="form-control" required>

                    </div>


                    <button class="btn btn-primary">
                        Crear
                    </button>

                </form>

            </div>


            <div class="col-md-7">

                <h1>Todas las Canciones</h1>

                {% for cancion in canciones %}

                <div class="card mb-2">

                    <div class="card-body">

                        <strong>
                            {{ cancion.titulo }}
                        </strong>

                        -
                        {{ cancion.artista }}

                    </div>

                </div>

                {% endfor %}


                <a href="{{ url_for('usuarios') }}" class="btn btn-secondary mt-3">
                    Usuarios
                </a>

            </div>

        </div>

    </div>

</body>

</html>
