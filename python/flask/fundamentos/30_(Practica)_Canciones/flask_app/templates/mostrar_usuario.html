<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        {{ usuario.nombre }}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <a
        href="{{ url_for('usuarios') }}"
        class="btn btn-secondary mb-4"
    >
        ← Usuarios
    </a>


    <h1>
        {{ usuario.nombre }}
    </h1>

    <p>
        {{ usuario.email }}
    </p>


    <hr>


    <h2>
        Favoritos
    </h2>


    {% if usuario.favoritos %}

        <table class="table">

            <thead>

                <tr>

                    <th>
                        Canción
                    </th>

                    <th>
                        Artista
                    </th>

                </tr>

            </thead>


            <tbody>

                {% for cancion in usuario.favoritos %}

                    <tr>

                        <td>
                            {{ cancion["titulo"] }}
                        </td>

                        <td>
                            {{ cancion["artista"] }}
                        </td>

                    </tr>

                {% endfor %}

            </tbody>

        </table>

    {% else %}

        <p>
            Este usuario todavía no tiene canciones favoritas.
        </p>

    {% endif %}

</div>

</body>

</html>
