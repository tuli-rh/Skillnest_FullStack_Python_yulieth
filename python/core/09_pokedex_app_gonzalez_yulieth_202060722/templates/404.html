<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon no encontrado</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <main class="error-container">

        <div class="error-card">

            <h1>¡Oh no!</h1>

            <h2>Pokémon no encontrado</h2>

            <p>
                {{ mensaje }}
            </p>

            <p>
                Revisa el nombre o número ingresado e inténtalo nuevamente.
            </p>

            <a href="/pokemon" class="boton azul">
                Volver a la Pokédex
            </a>

        </div>

    </main>

</body>

</html>
