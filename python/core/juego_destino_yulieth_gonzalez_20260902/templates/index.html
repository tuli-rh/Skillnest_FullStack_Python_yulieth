<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Juego del Destino</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


</head>

<body>


    <div class="contenedor">

        <h1>🔮 Juego del Destino</h1>

        <p>Descubre qué podría esperarte en el futuro.</p>

        <form action="/enviar" method="POST">

            <label for="nombre">¿Cuál es tu nombre?</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="edad">¿Cuál es tu edad?</label>
            <input type="number" id="edad" name="edad" required>

            <label for="sueno">¿Cuál es tu mayor sueño?</label>
            <input type="text" id="sueno" name="sueno" required>

            <button type="submit">
                🔮 Descubrir mi futuro
            </button>

        </form>

    </div>


</body>

</html>
